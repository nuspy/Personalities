# Default Pipeline Configuration

persona:
  author_name: ""
  era: ""
  value_dict: "roman_values"
  system_prompt_override: null

analysis:
  min_text_length: 100
  extract_formulas: true
  detect_special_patterns: true

dataset:
  num_conversations: 1000
  conversation_types:
    historical_facts: 0.25
    philosophy_values: 0.20
    anachronistic: 0.20
    character_personality: 0.15
    domain_expertise: 0.15
    casual_conversation: 0.05
  include_negative_examples: true
  negative_example_ratio: 0.2
  val_split: 0.1
  
  # LLM Provider Configuration
  llm_provider: "lm_studio"  # Options: "lm_studio", "nebius", "anthropic", "openai", "glm4"
  llm_base_url: "http://localhost:1234/v1" # Default for LM Studio
  llm_api_key: "lm-studio"
  llm_model_name: "local-model" # or specific model name like "meta-llama/Meta-Llama-3.1-70B-Instruct"

training:
  base_model: "unsloth/Meta-Llama-3.1-8B-Instruct"
  lora:
    r: 64
    alpha: 128
    dropout: 0.05
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
  max_seq_length: 4096
  load_in_4bit: true
  learning_rate: 0.0002
  weight_decay: 0.01
  warmup_ratio: 0.03
  num_epochs: 3
  per_device_batch_size: 4
  gradient_accumulation_steps: 4
  bf16: true
  gradient_checkpointing: true
  save_steps: 100
  save_total_limit: 3

evaluation:
  style_consistency_weight: 0.30
  anachronism_handling_weight: 0.30
  personality_coherence_weight: 0.20
  knowledge_boundaries_weight: 0.20
  test_prompts_per_category: 5

advanced:
  seed: 42
  logging_steps: 10
  eval_steps: 100
