# La console di amministrazione. Una replica basta: la usano poche persone,
# e il ruolo lo controlla l'API, non il fatto di raggiungere la pagina.
apiVersion: v1
kind: Service
metadata:
  name: admin
spec:
  selector:
    app.kubernetes.io/name: admin
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin
        # Raggiungibile dal gateway (istio/sicurezza.yaml).
        personalities/esposto: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: admin
          image: persona-admin
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          readinessProbe:
            httpGet: {path: /, port: 3000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: 3000}
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: cache
              mountPath: /app/.next/cache
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 256Mi
