# L'API: REST e SSE. Senza stato proprio — sessioni nei token, lavori in
# Redis, dati in Postgres — e quindi si moltiplica orizzontalmente.
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8100
      targetPort: 8100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        # Raggiungibile dal gateway (istio/sicurezza.yaml).
        personalities/esposto: "true"
    spec:
      # Le risposte in streaming durano decine di secondi: al termine si dà
      # tempo a quelle in corso di finire invece di troncarle a metà frase.
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        # Le migrazioni prima di servire. Più repliche che partono insieme si
        # mettono in fila su un lock consultivo di Postgres (vedi
        # platform_core/migrations/env.py): la prima aggiorna, le altre
        # trovano lo schema già aggiornato. Le migrazioni devono restare
        # compatibili con la versione precedente del codice, che durante il
        # rilascio continua a servire.
        - name: migrazioni
          image: persona-api
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: {name: persona-config}
            - secretRef: {name: persona-segreti}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
      containers:
        - name: api
          image: persona-api
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: persona-config}
            - secretRef: {name: persona-segreti}
          env:
            - name: PERSONA_ROLE
              value: api
          ports:
            - containerPort: 8100
              name: http
          # Liveness e readiness guardano il processo e non i supporti: un
          # database lento non deve far riavviare repliche sane, che
          # altrimenti ripartirebbero tutte insieme proprio quando serve meno.
          readinessProbe:
            httpGet: {path: /healthz, port: 8100}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8100}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: caricamenti
              mountPath: /var/lib/persona/caricamenti
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: caricamenti
          persistentVolumeClaim:
            claimName: caricamenti
        # Con il filesystem in sola lettura serve un posto per i file
        # temporanei: la trascrizione della dettatura e gli upload in transito.
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api}
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
  behavior:
    # Giù piano: una replica tolta mentre porta uno streaming lo interrompe.
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
