# Redis: code dei lavori, battiti dei worker, capacità della piattaforma.
# Con l'AOF su disco: un lavoro accodato che sparisce a un riavvio è una
# digestione di tre ore che nessuno farà mai, e che la console mostra «in coda».
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: tcp-redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes", "--dir", "/data"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - name: dati
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: dati
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
