# Il worker senza acceleratore: digestione e ingestione dei corpora. Legge
# solo la loro coda, e gli addestramenti non li vede nemmeno.
#
# Due contenitori, due processi: uno lavora, l'altro annuncia le capacità
# ogni 30 secondi. Separati perché una digestione occupa il processo per ore,
# e l'annuncio deve continuare anche allora — un worker che smette di
# battere sparisce dal registro e la console ne deduce che non c'è.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-cpu
spec:
  replicas: 1
  strategy:
    # Un lavoro interrotto a metà si dichiara fallito: si sostituisce un
    # worker alla volta, e solo dopo che il vecchio ha finito.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: worker-cpu
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker-cpu
    spec:
      # Il worker finisce il lavoro in corso prima di uscire: un'ingestione
      # di un'ora di audio merita il tempo di arrivare in fondo.
      terminationGracePeriodSeconds: 1800
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        # La chiave per accendere il motore locale, ricopiata con i permessi
        # che ssh pretende. Un volume di Secret non può averli: i file
        # arrivano di proprietà di root, e per farli leggere al processo
        # devono essere leggibili dal gruppo — cosa che ssh rifiuta
        # («Permissions 0440 are too open»). La copia nasce di proprietà
        # dell'utente che poi la usa, e a 0400 nessun altro la vede.
        #
        # Senza il Secret il worker parte lo stesso e l'accensione
        # automatica semplicemente non c'è: è la configurazione a decidere
        # se esiste, non la presenza di un file.
        - name: chiave-motore
          image: persona-worker
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            # Fallisce solo se il Secret c'è e la copia non riesce: un Secret
            # assente è una configurazione, un Secret illeggibile un difetto,
            # e nasconderli entrambi dietro un `|| true` li renderebbe uguali.
            - |
              set -e
              origine=/var/run/persona/motore-ssh
              for nome in accendi spegni known_hosts; do
                if [ -f "$origine/$nome" ]; then
                  cp -L "$origine/$nome" "/etc/persona/ssh/$nome"
                  chmod 400 "/etc/persona/ssh/$nome"
                fi
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - name: motore-ssh-segreto
              mountPath: /var/run/persona/motore-ssh
              readOnly: true
            - name: motore-ssh
              mountPath: /etc/persona/ssh
      containers:
        - name: lavori
          image: persona-worker
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "platform_core.builds", "--senza-acceleratore"]
          envFrom:
            - configMapRef: {name: persona-config}
            - secretRef: {name: persona-segreti}
          env:
            - name: PERSONA_ROLE
              value: worker-cpu
            - name: PERSONA_SERVICE_NAME
              value: persona-worker-cpu
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {memory: 6Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: caricamenti
              mountPath: /var/lib/persona/caricamenti
            - name: modelli
              mountPath: /var/lib/persona/modelli
            - name: motore-ssh
              mountPath: /etc/persona/ssh
              readOnly: true
        - name: battito
          image: persona-worker
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "platform_core.worker", "--role", "cpu"]
          envFrom:
            - configMapRef: {name: persona-config}
            - secretRef: {name: persona-segreti}
          env:
            - name: PERSONA_ROLE
              value: worker-cpu
          resources:
            requests: {cpu: 20m, memory: 96Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - name: caricamenti
          persistentVolumeClaim:
            claimName: caricamenti
        # Il modello di Whisper, scaricato al primo audio: su un volume
        # effimero del nodo, per non riscaricarlo a ogni riavvio del processo.
        - name: modelli
          emptyDir:
            sizeLimit: 10Gi
        # La chiave di accensione, come arriva: leggibile dal gruppo perché
        # l'initContainer possa ricopiarla, e mai usata da lì.
        - name: motore-ssh-segreto
          secret:
            secretName: motore-ssh
            defaultMode: 0440
            optional: true
        - name: motore-ssh
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
