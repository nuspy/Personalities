# La manutenzione periodica: rinnovi e scadenze degli abbonamenti, piani
# gratuiti per chi non ne ha, estrazione delle memorie dalle conversazioni
# finite, consolidamento. Una passata e basta per esecuzione: il ciclo lo fa
# lo scheduler, che sa riprovare e sa dire se una passata non è finita.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: manutenzione
spec:
  schedule: "*/10 * * * *"
  # Due passate sovrapposte rinnoverebbero due volte lo stesso abbonamento
  # se il lock di riga non ci fosse; con il lock, la seconda aspetterebbe
  # soltanto. Meglio non farla partire.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3000
      template:
        metadata:
          labels:
            app.kubernetes.io/name: manutenzione
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          containers:
            - name: passata
              image: persona-api
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "platform_core.jobs", "--limite", "100"]
              envFrom:
                - configMapRef: {name: persona-config}
                - secretRef: {name: persona-segreti}
              env:
                - name: PERSONA_SERVICE_NAME
                  value: persona-manutenzione
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {memory: 1Gi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
