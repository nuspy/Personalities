# Configurazione di Alembic.
#
# L'URL del database NON è qui: lo legge `migrations/env.py` dalle impostazioni
# dell'applicazione (PERSONA_DATABASE_URL). Averlo in due posti significa
# migrare il database sbagliato il giorno in cui uno dei due resta indietro —
# e in produzione quel giorno arriva.

[alembic]
script_location = platform_core/migrations
prepend_sys_path = .

# Le revisioni prendono il nome dalla data: `git log` e `ls` raccontano la
# stessa storia nello stesso ordine.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
