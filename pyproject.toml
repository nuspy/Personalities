[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "historical-persona-pipeline"
version = "0.2.0"
description = "Pipeline end-to-end per creare e addestrare Personaggi Storici basati su LLM"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "nuspy"}
]
dependencies = [
    # Core GUI & Logic
    "PyQt6>=6.5.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "python-magic>=0.4.27; sys_platform != 'win32'",
    
    # NLP & Linguistics
    "spacy>=3.7.0",
    "langdetect>=1.0.9",
    "huspacy>=0.11.0",
    "spacy-transformers",
    
    # Document Processing
    "PyMuPDF>=1.23.0",
    "python-docx>=1.0.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "olefile>=0.46",
    "striprtf>=0.0.26",          # .rtf
    "odfpy>=1.4.1",              # .odt
    "charset-normalizer>=3.0",   # codifiche non UTF-8
    # Verifica TLS con l'archivio certificati del sistema: necessario dove un
    # proxy aziendale o un antivirus rifirma il traffico HTTPS.
    "truststore>=0.8; python_version >= '3.10'",
    
    # AI & ML Core (Version Constraints for Unsloth Compatibility)
    "torch>=2.1.0",
    # Il tetto a 4.57.3 era ereditato da una vecchia nota su Unsloth e non
    # corrisponde piu' alla realta': Unsloth 2026.9 lavora con transformers 4.57,
    # e Unsloth Studio gira su transformers 5.5. Il codice si adatta alle firme
    # a runtime, quindi il vincolo resta largo; l'ultima major e' esclusa perche'
    # non e' stata verificata qui.
    "transformers>=4.51.3,<6", 
    "datasets>=2.16.0",
    "peft>=0.7.0",
    "trl>=0.7.0",
    "accelerate>=0.25.0",
    "bitsandbytes>=0.41.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    
    # LLM Providers
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "requests>=2.31.0",
    
    # Utils
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    # I test della piattaforma sono asincroni: senza questo plugin vengono
    # saltati, e una suite che salta i test dell'isolamento fra utenti resta
    # verde mentre non verifica nulla.
    "pytest-asyncio>=0.24",
    # Serve a firmare i token di prova con chiavi vere invece di simulare la
    # verifica. E' gia' una dipendenza indiretta di python-jose[cryptography],
    # ma qui e' un requisito diretto dei test.
    "cryptography>=43",
    "black",
    "ruff"
]
# Lingue antiche: CLTK e' pesante e non serve ai corpora moderni.
ancient = [
    "cltk>=1.1.0"
]
# OCR per i PDF scansionati. Richiede anche l'eseguibile Tesseract nel PATH.
ocr = [
    "pytesseract>=0.3.10",
    "pillow>=10.0.0"
]
# Addestramento e conversione. Unsloth e' opzionale: accelera, ma il codice
# ripiega su transformers + peft, con cui il ciclo e' stato verificato su
# RTX 5090 (Blackwell, sm_120).
training = [
    "transformers>=4.51.3,<6",
    "peft>=0.14",
    "trl>=0.12,<0.24",
    "datasets>=2.16",
    "accelerate>=0.34",
]
# Acceleratore opzionale. Richiede CUDA e versioni precise: se non si installa,
# l'addestramento funziona comunque tramite transformers + peft.
unsloth = [
    "unsloth @ git+https://github.com/unslothai/unsloth.git"
]
# Esportazione GGUF: lo script di conversione arriva dal repo llama.cpp, qui
# servono solo le sue dipendenze Python.
gguf = [
    "gguf>=0.10",
    "sentencepiece>=0.2",
    "protobuf>=4.0",
]
# Backend della piattaforma. Volutamente senza torch: l'API e il worker CPU
# non addestrano nulla, e trascinare CUDA in un'immagine che serve richieste
# HTTP significherebbe gigabyte per nulla.
backend = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
]

[project.scripts]
persona = "historical_persona_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["historical_persona_pipeline*", "platform_core*"]
[tool.pytest.ini_options]
# `auto`: i test asincroni non hanno bisogno di essere marcati uno per uno.
# Con la modalità stretta, un `async def test_...` senza marcatore viene
# saltato con un avviso — e un test saltato in silenzio è peggio di uno che
# fallisce, perché la suite resta verde.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["platform_core/tests", "historical_persona_pipeline/tests"]
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
]
