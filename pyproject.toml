[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "historical-persona-pipeline"
version = "0.1.0"
description = "Pipeline end-to-end per creare e addestrare Personaggi Storici basati su LLM"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Gemini Agent", email = "agent@example.com"}
]
dependencies = [
    # Core GUI & Logic
    "PyQt6>=6.5.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "python-magic>=0.4.27; sys_platform != 'win32'",
    
    # NLP & Linguistics
    "spacy>=3.7.0",
    "langdetect>=1.0.9",
    "cltk>=1.1.0",
    "huspacy>=0.11.0",
    "spacy-transformers",
    
    # Document Processing
    "PyMuPDF>=1.23.0",
    "python-docx>=1.0.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "olefile>=0.46",
    
    # AI & ML Core (Version Constraints for Unsloth Compatibility)
    "torch>=2.1.0",
    # Unsloth requires transformers >= 4.51.3 and <= 4.57.3 (as of current release)
    "transformers>=4.51.3,<=4.57.3", 
    "datasets>=2.16.0",
    "peft>=0.7.0",
    "trl>=0.7.0",
    "accelerate>=0.25.0",
    "bitsandbytes>=0.41.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    
    # LLM Providers
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "requests>=2.31.0",
    
    # Utils
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff"
]
# Unsloth installation
training = [
    "unsloth[colab-new] @ git+https://github.com/unslothai/unsloth.git"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["historical_persona_pipeline*"]